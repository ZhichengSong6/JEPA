defaults:
  - _self_
  - data: pusht

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

# Keep W&B disabled by default on the research branch.
wandb:
  enabled: False
  config:
    entity: lewm
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024

# Stage I: Bias-Calibrated Action-Conditioned JEPA.
#
# IMPORTANT:
#   * enabled=False leaves the existing LeWM/Factor training forward unchanged.
#   * enabled=True should be launched with `data=pusht_stage1`.
#   * no simulator state, physical factor target, candidate ranking label, or
#     planning-time verifier is used by this objective.
#   * CEM inference and jepa.py criterion() remain raw latent MSE.
stage1:
  enabled: False
  rollout_horizon: 5
  rollout_weight: 1.0
  action_projected_bias_weight: 1.0
  perturb_radius: 0.1565
  num_directions: 2
  perturb_first_only: True

# Stage II: Goal-relative landscape-faithful fine-tuning.
#
# The first controlled Stage-II experiment starts from official LeWM epoch 10,
# uses the same checkpoint as a frozen curvature teacher, and replaces Stage-I
# APB with two direct planner-facing terms:
#   (1) suppress predicted +/- goal-cost odd asymmetry around an observed
#       future endpoint target;
#   (2) preserve the teacher's sampled action-response Gram matrix, including
#       its absolute response scale.
#
# Training uses only offline observations/actions. No simulator state or
# counterfactual ground-truth rollout is loaded.
stage2:
  enabled: False

  init_policy: lewm_epoch_10
  teacher_policy: lewm_epoch_10

  rollout_horizon: 5
  rollout_weight: 1.0

  odd_weight: 1.0
  curvature_weight: 1.0

  # Same exact first-coarse-block raw-action perturbation scale used throughout
  # the fixed-action diagnostics.
  perturb_radius: 0.1565
  perturb_first_only: True

  # K=4 is the first formal setting: enough to constrain cross-direction Gram
  # structure while remaining far cheaper than the 64-direction evaluator.
  num_directions: 4

  # L_odd is normalized by frozen-teacher quadratic-energy squared; L_curv is
  # normalized by frozen-teacher Gram Frobenius energy. These floors only avoid
  # division by numerically near-zero local response energy.
  odd_normalization_eps: 1.0e-6
  gram_normalization_eps: 1.0e-8

# Optional full-PushT physical factor supervision.
# disabled => exact original LeWM objective / architecture.
# enabled  => training-only heads for pusher XY, block XY, and block rotation.
# CEM never reads these heads; jepa.py criterion() remains raw-latent MSE.
factor:
  enabled: False
  world_size: 512.0
  head_hidden_dim: 256
  head_depth: 2

  # Same outer auxiliary weights used in the simplified factor experiment.
  encoded_weight: 0.10
  predicted_weight: 0.05
  metric_weight: 0.05

  # The three 2-D factors are ALWAYS averaged equally (1/3 each) in train.py.
  theta_norm_weight: 0.05
  metric_smooth_l1_beta: 0.05

  # Fixed normalization statistics derived once from the raw training states.
  # These are data statistics, not tuned planning/model hyperparameters.
  metric_scale_quantile: 0.95
  metric_scale_num_pairs: 200000
  metric_scales:
    pusher: 1.0
    block: 1.0
    theta: 1.0
