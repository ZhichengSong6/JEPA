defaults:
  - _self_
  - data: pusht

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

trainer:
  max_epochs: 100
  devices: auto
  num_nodes: 1
  accelerator: gpu
  strategy: auto
  sync_batchnorm: False
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: False
  config:
    entity: lewm
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.09
    # False preserves the original single-GPU implementation. Formal 4-GPU
    # A/B/C runs set this True so SIGReg sees the same global batch=64 rather
    # than four independent local batches of 16.
    global_batch_ddp: False
    kwargs:
      knots: 17
      num_proj: 1024

# Stage I: Bias-Calibrated Action-Conditioned JEPA.
stage1:
  enabled: False
  rollout_horizon: 5
  rollout_weight: 1.0
  action_projected_bias_weight: 1.0
  perturb_radius: 0.1565
  num_directions: 2
  perturb_first_only: True

# Stage II: goal-relative landscape-faithful training.
# init_mode=pretrained is Experiment A; init_mode=random is Experiment C.
# Both use the official LeWM epoch-10 checkpoint as a frozen curvature teacher.
stage2:
  enabled: False
  init_mode: pretrained
  init_policy: lewm_epoch_10
  teacher_policy: lewm_epoch_10

  rollout_horizon: 5
  rollout_weight: 1.0

  odd_weight: 1.0
  curvature_weight: 1.0

  perturb_radius: 0.1565
  perturb_first_only: True
  num_directions: 4

  # Process two perturbation directions at once. With formal 4-GPU training,
  # local batch=16, so a chunk contains 2 signs * 2 directions * 16 = 64
  # predictor candidates: similar peak candidate batch to the successful
  # single-GPU smoke, while cutting probe-rollout calls by ~4x.
  probe_directions_per_chunk: 2

  odd_normalization_eps: 1.0e-6
  gram_normalization_eps: 1.0e-8

# Experiment B: ordinary LeWM continuation control. It starts from the same
# official epoch-10 model and trains for the same additional epochs/batches as
# Experiment A, but uses only the original one-step LeWM + SiGReg objective.
continuation:
  enabled: False
  init_policy: lewm_epoch_10

# Optional full-PushT physical factor supervision.
factor:
  enabled: False
  world_size: 512.0
  head_hidden_dim: 256
  head_depth: 2

  encoded_weight: 0.10
  predicted_weight: 0.05
  metric_weight: 0.05

  theta_norm_weight: 0.05
  metric_smooth_l1_beta: 0.05

  metric_scale_quantile: 0.95
  metric_scale_num_pairs: 200000
  metric_scales:
    pusher: 1.0
    block: 1.0
    theta: 1.0
