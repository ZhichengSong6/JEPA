defaults:
  - _self_
  - data: pusht_mh_ald

# Exp1: isolate teacher quality.
# Student initialization, frozen visual frame, data, optimizer, loss weights,
# perturbation scale, horizon, and training budget are identical to formal
# MH-ALD.  The ONLY scientific change is:
#
#   teacher: official LeWM epoch-10 -> current formal MH-ALD epoch-10
#
# Student still initializes from official LeWM epoch-10.

output_model_name: lewm_mh_ald_teacher_mh_h5_ddp4
subdir: pusht_mh_ald_teacher_mh_h5_seed3072_ep10_ddp4

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224

trainer:
  max_epochs: 10
  devices: auto
  num_nodes: 1
  accelerator: gpu
  strategy: auto
  sync_batchnorm: false
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 64
  num_workers: ${num_workers}
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: false
  config:
    entity: lewm
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: false

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

loss:
  sigreg:
    kwargs:
      knots: 17
      num_proj: 1024

mh_ald:
  enabled: true

  # Controlled Exp1:
  #   student init stays official LeWM
  #   teacher is replaced by the already-trained formal MH-ALD model
  init_policy: lewm_epoch_10
  teacher_policy: pusht_mh_ald_h5_seed3072_ep10_ddp4/lewm_mh_ald_h5_ddp4_epoch_10

  rollout_horizon: 5

  # EXACTLY the formal MH-ALD objective/weights.
  tf_weight: 1.0
  rollout_weight: 1.0
  weight: 1.0

  # EXACTLY the formal MH-ALD probe construction.
  perturb_radius: 0.1565
  directions_per_position: 1
  probes_per_chunk: 2
