defaults:
  - _self_
  - data: pusht_stage2_v2

output_model_name: lewm_stage2_v2_A_apbjvp_h5_ddp4
subdir: pusht_stage2_v2_A_apbjvp_h5_seed3072_ep10_ddp4

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224

trainer:
  max_epochs: 10
  devices: auto
  num_nodes: 1
  accelerator: gpu
  strategy: auto
  sync_batchnorm: false
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 64
  num_workers: ${num_workers}
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: false
  config:
    entity: lewm
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: false

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

loss:
  sigreg:
    weight: 0.09
    # Formal 4-GPU runs override this to true so SIGReg sees the same
    # global batch=64 as the controlled Stage-II A/B/C experiments.
    global_batch_ddp: false
    kwargs:
      knots: 17
      num_proj: 1024

stage2_v2:
  enabled: true

  # Decisive A-v2 only: both student initialization and frozen JVP teacher are
  # the official LeWM epoch-10 model.
  init_policy: lewm_epoch_10
  teacher_policy: lewm_epoch_10

  rollout_horizon: 5
  rollout_weight: 1.0
  apb_weight: 1.0
  jvp_weight: 1.0

  # Match the established fixed-action diagnostic / Stage-I setup.
  perturb_radius: 0.1565
  perturb_first_only: true
  num_directions: 4
  probe_directions_per_chunk: 2

  # APB direction normalization and relative teacher-response normalization.
  response_eps: 1.0e-8
  jvp_normalization_eps: 1.0e-6
