defaults:
  - _self_
  - data: pusht_bias_only

output_model_name: lewm_bias_only_h5_ddp4
subdir: pusht_bias_only_h5_seed3072_ep10_ddp4

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224

trainer:
  max_epochs: 10
  devices: auto
  num_nodes: 1
  accelerator: gpu
  strategy: auto
  sync_batchnorm: false
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 64
  num_workers: ${num_workers}
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: false
  config:
    entity: lewm
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: false

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

loss:
  # Compatibility field required by the existing spt.Module wrapper.
  # SIGReg is NOT part of Bias-Only optimization.
  sigreg:
    kwargs:
      knots: 17
      num_proj: 1024

bias_only:
  enabled: true
  base_policy: lewm_epoch_10
  rollout_horizon: 5
  hidden_dim: 256
