# Full PushT sequence for Pure-ALD.
# One dataset step = one LeWM coarse step = 5 raw PushT actions.
# No privileged simulator state is loaded.
dataset:
  num_steps: ${eval:'${wm.history_size} + ${pure_ald.rollout_horizon}'}
  frameskip: 5
  name: pusht_expert_train
  keys_to_load:
    - pixels
    - action
    - proprio
  keys_to_cache:
    - action
    - proprio
