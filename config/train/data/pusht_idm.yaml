# Four-frame PushT clips for inverse-dynamics-only LeWM continuation.
# Each coarse dataset step contains 5 raw PushT actions.  No simulator state,
# reward, value, or counterfactual supervision is loaded.
dataset:
  num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
  frameskip: 5
  name: pusht_expert_train
  keys_to_load:
    - pixels
    - action
    - proprio
  keys_to_cache:
    - action
    - proprio
