defaults:
  - _self_
  - data: pusht_idm

# Pure inverse-dynamics LeWM continuation.
#
# Single intervention relative to ordinary LeWM continuation:
#   add L_IDM = ||h_inv(z_t, z_{t+1}) - a_t||^2
#
# The official LeWM predictor loss, SIGReg weight, optimizer, latent dimension,
# planner, and raw-latent terminal cost are unchanged.  No simulator state,
# reward/value label, counterfactual rollout, or planner-generated target is
# used.  The inverse head is training-only and is stripped from object
# checkpoints used by AutoCostModel at evaluation time.

output_model_name: lewm_idm_w010_ddp4
subdir: pusht_lewm_idm_w010_seed3072_ep10_ddp4

num_workers: 4
train_split: 0.9
seed: 3072
img_size: 224

trainer:
  max_epochs: 10
  devices: auto
  num_nodes: 1
  accelerator: gpu
  strategy: auto
  sync_batchnorm: false
  precision: bf16
  gradient_clip_val: 1.0

# Formal launch uses 4 DDP ranks.  Batch size is per rank, giving the same
# global batch=128 as the published DA-LeWM/LeWM configuration.
loader:
  batch_size: 32
  num_workers: ${num_workers}
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: false
  config:
    entity: lewm
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: false

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

loss:
  sigreg:
    weight: 0.09
    # DDP formal runs gather the latent batch differentiably before SIGReg, so
    # its semantics match one global batch instead of four rank-local batches.
    global_batch_ddp: true
    kwargs:
      knots: 17
      num_proj: 1024

idm:
  enabled: true

  # Same pretrained starting point used by the calibration experiments.
  init_policy: lewm_epoch_10

  # Inverse-only DA-LeWM default.  We deliberately do not add the goal-action
  # head yet: this experiment isolates encoder-side action identifiability.
  weight: 0.10
  head_hidden_dim: 256
  head_depth: 2

  # Four observations contain exactly three valid adjacent transitions, matching
  # the base LeWM context z0,z1,z2 -> targets z1,z2,z3.
  max_transitions: 3
