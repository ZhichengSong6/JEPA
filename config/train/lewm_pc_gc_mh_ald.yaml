defaults:
  - _self_
  - data: pusht_mh_ald

# Planner-Context Goal-Coupled Multi-Horizon ALD (PC-GC-MH).
#
# Controlled against formal MH-ALD / PC-GP-MH:
#   * same official LeWM epoch-10 student initialization and frozen teacher
#   * same frozen encoder/projector latent frame
#   * same offline PushT data, optimizer, LR, batch size, seed, epochs
#   * same trainable modules: action_encoder + predictor + pred_proj
#   * same unchanged official CEM and planning-time raw latent distance
#   * same planner-context 1->2->3 rollout semantics
#   * same finite raw-action probe radius 0.30
#
# Scientific change from PC-GP-MH:
#   terminal anisotropic calibration uses residual-weighted goal coupling
#
#       E[(d^T e)^2] / (D * sg(E[||d||^2]) + eps)
#
#   with ONE shared detached normalization scale.  Unlike per-candidate
#   projection normalization, this preserves relative ||d_i||^2 sensitivity.
#
# No simulator state, counterfactual real rollout, reward/readout, rank label,
# or planner modification is used for training.

output_model_name: lewm_pc_gc_mh_h5_r030_ddp4
subdir: pusht_pc_gc_mh_h5_r030_seed3072_ep10_ddp4

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224

trainer:
  max_epochs: 10
  devices: auto
  num_nodes: 1
  accelerator: gpu
  strategy: auto
  sync_batchnorm: false
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 64
  num_workers: ${num_workers}
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: false
  config:
    entity: lewm
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: false

wm:
  type: lewm
  # Keep predictor maximum history and dataset/TF context at 3.
  # Only planner-context rollouts start from one observed latent.
  history_size: 3
  num_preds: 1
  embed_dim: 192

loss:
  sigreg:
    kwargs:
      knots: 17
      num_proj: 1024

mh_ald:
  enabled: true
  init_policy: lewm_epoch_10
  teacher_policy: lewm_epoch_10
  rollout_horizon: 5

  # Keep formal MH-ALD weighting unchanged.
  tf_weight: 1.0
  rollout_weight: 1.0
  weight: 1.0

  # Keep the finite-displacement scale from the completed multiscale diagnosis.
  perturb_radius: 0.30
  directions_per_position: 1
  probes_per_chunk: 2

  planner_context:
    enabled: true
    observation_history: 1
    predictor_max_history: 3

  goal_coupled:
    enabled: true
    # First controlled test: one additional residual-weighted decision-sensitive
    # term.  Do not sweep this before rechecking the diagnosed mechanism.
    weight: 1.0
    normalization_eps: 1e-8
